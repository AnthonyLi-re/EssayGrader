[build]
  command = "npm run netlifybuild"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20.19.1"
  NPM_FLAGS = "--platform=linux --arch=x64"

[functions]
  external_node_modules = ["canvas", "sharp"]
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Avoid installing problematic dependencies
[build.processing.css]
  bundle = true
  minify = true 